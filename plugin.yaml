name: pomelu
version: 1.1.2
description: "Messages Hermes sends on its own (reminders, scheduled jobs, reports) go to the Pomelu app's Bot Chat, and a Bot Chat reply rings the phone by push, also while the app is closed."
author: "AmirHossein Teymoori (Royan AB)"
license: Apache-2.0
homepage: https://github.com/ateymoori/pomelu-hermes-plugin
requires_hermes: ">=0.22"
provides_hooks:
  - pre_tool_call
  - post_llm_call
